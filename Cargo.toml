[workspace]
resolver = "3"
members = ["crates/kb-core", "crates/kb-tui", "crates/kb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
kb-core = { path = "crates/kb-core" }
kb-tui = { path = "crates/kb-tui" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
toml = "1"
url = "2"

[profile.release]
codegen-units = 4
