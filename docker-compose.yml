# tui-kanban database. Passwords come from .env (generated by scripts/setup.ps1 or scripts/setup.sh).
# The fixed project name lets any checkout of this repo manage the same container.
name: tui-kanban

services:
  postgres:
    image: postgres:17-alpine
    container_name: kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb_admin
      POSTGRES_PASSWORD: ${KB_ADMIN_PASSWORD:?run scripts/setup.ps1 or scripts/setup.sh to create .env}
      POSTGRES_DB: kanban
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kb-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP: the image's first-run init server listens only on the unix socket,
      # so this does not report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kb_admin -d kanban"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  kb-pgdata:
    name: kb-pgdata
